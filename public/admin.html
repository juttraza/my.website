<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Ember &amp; Oak · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F2EC;--card:#fff;--ink:#1C1917;--mute:#6B6560;--line:#E7E1D6;--acc:#B4532A;--ok:#2D6A3E;--okbg:#DCEEE1;--warn:#8C5A00;--warnbg:#F8EBCB;--bad:#B3261E;--badbg:#F7DDD9;--serif:"Fraunces",Georgia,serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{font-family:var(--sans);letter-spacing:0;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:14px;transition:background .2s,border-color .2s,transform .15s}
.btn:hover{border-color:#cfc6b8;background:#FBF9F5}.btn:active{transform:translateY(1px)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.dark:hover{background:#000}
.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}.btn.acc:hover{background:#9c4723}
.btn.sm{padding:6px 11px;font-size:12.5px;border-radius:6px}
.btn.danger{color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:42px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(180,83,42,.12)}
label{display:grid;gap:6px;font-size:12.5px;font-weight:500;color:var(--mute)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:0}

/* Login */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.login{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px;display:grid;gap:18px;box-shadow:0 30px 60px -40px rgba(28,25,23,.4)}
.login h1{font-size:30px}.login p{margin:0;color:var(--mute)}

/* Shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--ink);color:#fff;padding:28px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:0;height:100vh}
.brand{font:500 24px/1 var(--serif);letter-spacing:-.03em;padding:0 10px}.brand small{display:block;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#E08A5F;margin-top:10px}
.nav{display:grid;gap:4px}
.nav button{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 12px;border:0;border-radius:8px;background:none;color:#B9B2A9;cursor:pointer;text-align:left;font-weight:500;transition:background .2s,color .2s}
.nav button:hover{background:#2A2522;color:#fff}.nav button[aria-current=page]{background:#2F2926;color:#fff}
.nav .count{font-size:12px;background:var(--acc);color:#fff;border-radius:999px;padding:1px 8px}
.side-foot{margin-top:auto;display:grid;gap:4px}
.side-foot a,.side-foot button{padding:10px 12px;border-radius:8px;color:#B9B2A9;text-decoration:none;background:none;border:0;cursor:pointer;text-align:left;font-weight:500}
.side-foot a:hover,.side-foot button:hover{background:#2A2522;color:#fff}
.main{padding:36px clamp(20px,4vw,48px) 64px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.top h1{font-size:34px}.top p{margin:6px 0 0;color:var(--mute)}
.view{animation:fade .45s var(--ease)}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.stat{padding:20px 22px}.stat span{font-size:12.5px;color:var(--mute);font-weight:500}
.stat b{display:block;font:500 38px/1.15 var(--serif);letter-spacing:-.03em;margin-top:6px}.stat small{color:var(--mute)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;margin-bottom:20px}
.panel{padding:22px 24px}.panel h2{font-size:21px;margin-bottom:16px}
.empty{color:var(--mute);padding:18px 0}
.slot{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}.slot:first-of-type{border-top:0}
.slot time{font-weight:600}.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin:6px 0 8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .8s var(--ease)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:12.5px;background:var(--bg);border-radius:999px;padding:2px 10px}.chip.s{background:var(--okbg);color:var(--ok)}.chip.c{background:var(--badbg);color:var(--bad);text-decoration:line-through}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end;height:170px}
.week div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%;font-size:12px;color:var(--mute)}
.week i{width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:#E7D3C6;min-height:4px;transition:height .8s var(--ease)}.week div.t i{background:var(--acc)}.week b{color:var(--ink);font-size:13px}
.next{display:grid;gap:0}.next>div{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.next>div:first-child{border-top:0}
.next small{color:var(--mute);display:block}

/* Toolbar + table */
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1;min-width:200px;max-width:340px}
.seg{display:inline-flex;background:#EAE5DA;border-radius:9px;padding:3px}.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--mute)}.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.toolbar select{width:auto;min-width:140px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:900px}
th{text-align:left;font-size:12px;font-weight:500;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap;background:#FBF9F5}
td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}tbody tr:hover{background:#FDFBF8}
td small{display:block;color:var(--mute)}td a{color:inherit;text-decoration:none}td a:hover{text-decoration:underline}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:12px;font-weight:500;background:#EDE8DE}
.pill.confirmed{background:var(--warnbg);color:var(--warn)}.pill.seated{background:var(--okbg);color:var(--ok)}.pill.cancelled{background:var(--badbg);color:var(--bad)}
.acts{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.tag{font-size:11px;background:#EAE5DA;border-radius:4px;padding:1px 6px;margin-left:6px;color:var(--mute);font-weight:500}
.meta{color:var(--mute);margin-left:auto}

/* Menu manager */
.cat{margin-bottom:26px}.cat h2{font-size:21px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.dish{display:grid;grid-template-columns:64px 1.1fr 2fr 90px 130px auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}.dish:first-child{border-top:0}
.thumb{width:64px;height:48px;border-radius:6px;background:#EAE5DA;overflow:hidden;display:grid;place-items:center;font-size:10px;color:var(--mute)}.thumb img{width:100%;height:100%;object-fit:cover}
.savebar{position:sticky;bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:0 20px 40px -16px rgba(0,0,0,.45);margin-top:20px}

/* Dialog + toast */
dialog{border:0;border-radius:14px;padding:0;width:min(480px,calc(100% - 32px));box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}dialog::backdrop{background:rgba(20,17,15,.55);backdrop-filter:blur(2px)}
dialog form{padding:28px;display:grid;gap:14px}dialog h2{font-size:24px}dialog p{margin:0;color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dlg-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:10px;z-index:200}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 14px 30px -10px rgba(0,0,0,.4);animation:fade .35s var(--ease);max-width:340px}.toast.bad{background:var(--bad)}

@media(max-width:1000px){.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.dish{grid-template-columns:64px 1fr 90px;grid-template-areas:"t n p" "t d d" "c c x"}.dish .thumb{grid-area:t}.dish .f-n{grid-area:n}.dish .f-d{grid-area:d}.dish .f-p{grid-area:p}.dish .f-c{grid-area:c}.dish .f-x{grid-area:x;justify-self:end}}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:14px}.nav{display:flex;order:3;width:100%;overflow-x:auto}.side-foot{margin:0 0 0 auto;display:flex}.brand small{display:none}.main{padding-top:24px}}
@media(max-width:520px){.stats{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head>
<body>

<div class="login-wrap" id="login-wrap">
  <form class="login" id="login">
    <h1>Ember &amp; Oak</h1><p>Sign in to manage reservations and the menu.</p>
    <label>Admin token<input id="tok" type="password" autocomplete="current-password" required autofocus></label>
    <button class="btn dark" type="submit">Sign in</button><p class="err" id="lmsg" role="alert"></p>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="brand">Ember &amp; Oak<small>Admin</small></div>
    <nav class="nav" aria-label="Admin sections">
      <button data-view="overview" aria-current="page">Overview</button>
      <button data-view="reservations">Reservations <span class="count" id="nav-count" hidden></span></button>
      <button data-view="menu">Menu</button>
    </nav>
    <div class="side-foot"><a href="/" target="_blank" rel="noopener">View website ↗</a><button id="out">Sign out</button></div>
  </aside>
  <main class="main">
    <div class="top">
      <div><h1 id="title">Overview</h1><p id="subtitle"></p></div>
      <button class="btn acc" id="new-booking">+ New booking</button>
    </div>
    <section class="view" id="v-overview"></section>
    <section class="view" id="v-reservations" hidden></section>
    <section class="view" id="v-menu" hidden></section>
  </main>
</div>

<dialog id="dlg-new"><form method="dialog" id="f-new" novalidate>
  <h2>New booking</h2><p>For phone calls and walk-ins. It uses the same seat limits as the website.</p>
  <label>Guest name<input name="name" required maxlength="80"></label>
  <div class="row2"><label>Phone<input name="phone" type="tel"></label><label>Email (optional)<input name="email" type="email"></label></div>
  <div class="row2"><label>Date<input name="date" type="date" required></label><label>Guests<select name="guests"></select></label></div>
  <label>Time<select name="time" disabled><option value="">Choose a date first</option></select></label>
  <label>Notes<textarea name="notes" rows="2" maxlength="300"></textarea></label>
  <p class="err" id="new-err" role="alert"></p>
  <div class="dlg-actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn dark" id="new-save">Save booking</button></div>
</form></dialog>

<dialog id="dlg-confirm"><form method="dialog" id="f-confirm">
  <h2 id="cf-title">Are you sure?</h2><p id="cf-text"></p>
  <div class="dlg-actions"><button type="button" class="btn" data-close>Cancel</button><button type="submit" class="btn danger" id="cf-ok">Delete</button></div>
</form></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const h = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'value') n.value = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach((c) => { if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(c)); });
    return n;
  };
  const pad = (n) => String(n).padStart(2, '0');
  const dstr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayStr = () => dstr(new Date());
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return dstr(d); };
  const fmtT = (t) => { const [hh, m] = t.split(':').map(Number); return `${hh % 12 || 12}:${pad(m)} ${hh >= 12 && hh < 24 ? 'pm' : 'am'}`; };
  const fmtD = (s, long) => new Date(s + 'T00:00:00').toLocaleDateString('en-GB', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: 'numeric', month: 'short' });
  const covers = (list) => list.reduce((n, r) => n + r.guests, 0);
  const live = (list) => list.filter((r) => r.status !== 'cancelled');

  let token = sessionStorage.getItem('eo_admin') || '', all = [], menu = [], menuDirty = false, cfg = { hours: {}, seatsPerSlot: 40, maxParty: 12 };
  let view = 'overview', filt = { q: '', range: 'upcoming', status: '' }, lastCount = null, poll = null;

  // ---------- helpers ----------
  const toast = (text, bad) => { const t = h('div', { class: 'toast' + (bad ? ' bad' : ''), role: 'status' }, text); $('#toasts').append(t); setTimeout(() => t.remove(), 3800); };
  const call = async (url, opts = {}) => {
    const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' } });
    if (res.status === 401) { signOut(); throw new Error('Wrong or expired token.'); }
    if (res.status === 204) return null;
    const b = await res.json().catch(() => ({})); if (!res.ok) throw new Error(b.error || 'Request failed'); return b;
  };
  const ask = (title, text, okLabel) => new Promise((resolve) => {
    const dlg = $('#dlg-confirm'); $('#cf-title').textContent = title; $('#cf-text').textContent = text; $('#cf-ok').textContent = okLabel || 'Confirm';
    dlg.returnValue = ''; dlg.showModal();
    dlg.addEventListener('close', () => resolve(dlg.returnValue === 'ok'), { once: true });
    $('#cf-ok').onclick = () => { dlg.returnValue = 'ok'; };
  });
  $$('[data-close]').forEach((b) => b.addEventListener('click', () => b.closest('dialog').close()));

  // ---------- data ----------
  async function loadAll(quiet) {
    const [res, conf] = await Promise.all([call('/api/admin/reservations'), fetch('/api/hours').then((r) => r.json())]);
    cfg = conf;
    const fresh = res.filter((r) => r.status !== 'cancelled' && r.date >= todayStr()).length;
    if (quiet && lastCount !== null && fresh > lastCount) toast(`New booking received (${fresh - lastCount})`);
    lastCount = fresh; all = res;
    $('#login-wrap').hidden = true; $('#shell').hidden = false;
    renderCount(); if (view !== 'menu') render();
  }
  function renderCount() {
    const n = live(all).filter((r) => r.date === todayStr()).length, c = $('#nav-count');
    c.textContent = n; c.hidden = !n;
  }
  async function setStatus(r, status) { await call('/api/admin/reservations/' + r.id, { method: 'PATCH', body: JSON.stringify({ status }) }); r.status = status; toast(`${r.name}: ${status}`); render(); renderCount(); }
  async function remove(r) { if (!await ask('Delete this booking?', `${r.name}, ${fmtD(r.date)} at ${fmtT(r.time)}. This cannot be undone.`, 'Delete')) return; await call('/api/admin/reservations/' + r.id, { method: 'DELETE' }); all = all.filter((x) => x.id !== r.id); toast('Booking deleted'); render(); renderCount(); }

  // ---------- shared row actions ----------
  function actions(r) {
    const b = (label, fn, cls = '') => h('button', { class: 'btn sm ' + cls, onclick: () => fn().catch((e) => toast(e.message, true)) }, label);
    const out = [];
    if (r.status === 'confirmed') out.push(b('Seat', () => setStatus(r, 'seated')), b('Cancel', () => setStatus(r, 'cancelled')));
    if (r.status === 'seated') out.push(b('Undo', () => setStatus(r, 'confirmed')));
    if (r.status === 'cancelled') out.push(b('Restore', () => setStatus(r, 'confirmed')));
    out.push(b('Delete', () => remove(r), 'danger'));
    return h('div', { class: 'acts' }, out);
  }

  // ---------- Overview ----------
  function renderOverview(root) {
    const t = todayStr(), todays = all.filter((r) => r.date === t), tl = live(todays);
    const week = live(all).filter((r) => r.date >= t && r.date <= addDays(t, 6));
    const cancelled = all.filter((r) => r.status === 'cancelled' && r.date >= t);
    const stat = (label, val, sub) => h('div', { class: 'card stat' }, h('span', {}, label), h('b', {}, val), h('small', {}, sub));
    const stats = h('div', { class: 'stats' },
      stat("Today's guests", covers(tl), `${covers(tl.filter((r) => r.status === 'seated'))} seated so far`),
      stat("Today's bookings", tl.length, tl.length ? `Next: ${fmtT(tl.filter((r) => r.status === 'confirmed').sort((a, b) => a.time.localeCompare(b.time))[0]?.time || tl[0].time)}` : 'Nothing yet'),
      stat('Next 7 days', covers(week), `${week.length} bookings`),
      stat('Cancelled', cancelled.length, 'upcoming, can be restored'));

    // today's service
    const slotMap = {};
    todays.forEach((r) => (slotMap[r.time] ||= []).push(r));
    const service = h('div', { class: 'card panel' }, h('h2', {}, `Today's service`));
    const times = Object.keys(slotMap).sort();
    if (!times.length) service.append(h('div', { class: 'empty' }, 'No bookings for today yet.'));
    times.forEach((time) => {
      const rs = slotMap[time], used = covers(live(rs)), pct = Math.min(100, Math.round(used / cfg.seatsPerSlot * 100));
      const bar = h('div', { class: 'bar' }, h('i', { style: 'width:0' })); requestAnimationFrame(() => requestAnimationFrame(() => { bar.firstChild.style.width = pct + '%'; }));
      service.append(h('div', { class: 'slot' }, h('time', {}, fmtT(time)),
        h('div', {}, h('small', { class: 'meta', style: 'margin:0' }, `${used} of ${cfg.seatsPerSlot} seats`), bar,
          h('div', { class: 'chips' }, rs.map((r) => h('span', { class: 'chip ' + (r.status === 'seated' ? 's' : r.status === 'cancelled' ? 'c' : '') }, `${r.name} · ${r.guests}`))))));
    });

    // 7 day chart
    const days = Array.from({ length: 7 }, (_, i) => addDays(t, i)), max = Math.max(1, ...days.map((d) => covers(live(all).filter((r) => r.date === d))));
    const chart = h('div', { class: 'week' }, days.map((d, i) => {
      const n = covers(live(all).filter((r) => r.date === d)), bar = h('i', { style: 'height:4px' });
      requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.height = Math.max(4, n / max * 120) + 'px'; }));
      return h('div', { class: i === 0 ? 't' : '' }, h('b', {}, n), bar, new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { weekday: 'short' }));
    }));
    const weekPanel = h('div', { class: 'card panel' }, h('h2', {}, 'Guests, next 7 days'), chart);

    // next arrivals
    const nowT = `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`;
    const nextList = live(all).filter((r) => r.status === 'confirmed' && (r.date > t || (r.date === t && r.time >= nowT))).sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time)).slice(0, 5);
    const nextPanel = h('div', { class: 'card panel' }, h('h2', {}, 'Next arrivals'));
    if (!nextList.length) nextPanel.append(h('div', { class: 'empty' }, 'No upcoming bookings.'));
    else nextPanel.append(h('div', { class: 'next' }, nextList.map((r) => h('div', {}, h('div', {}, h('strong', {}, `${r.name} · ${r.guests}`), h('small', {}, `${fmtD(r.date)} at ${fmtT(r.time)}`)), actions(r)))));

    root.replaceChildren(stats, h('div', { class: 'grid2' }, service, h('div', { style: 'display:grid;gap:20px;align-content:start' }, weekPanel, nextPanel)));
  }

  // ---------- Reservations ----------
  function renderReservations(root) {
    const t = todayStr(), q = filt.q.trim().toLowerCase();
    let list = all.filter((r) => (filt.range === 'all' || (filt.range === 'today' && r.date === t) || (filt.range === 'upcoming' && r.date >= t) || (filt.range === 'past' && r.date < t))
      && (!filt.status || r.status === filt.status) && (!q || [r.name, r.email, r.phone, r.code, r.notes].some((x) => (x || '').toLowerCase().includes(q))));
    list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) * (filt.range === 'past' ? -1 : 1));

    const search = h('input', { class: 'search', type: 'search', placeholder: 'Search name, email, phone or code', value: filt.q, 'aria-label': 'Search reservations', oninput: (e) => { filt.q = e.target.value; refreshRows(); } });
    const seg = h('div', { class: 'seg', role: 'group', 'aria-label': 'Date range' }, [['today', 'Today'], ['upcoming', 'Upcoming'], ['past', 'Past'], ['all', 'All']].map(([v, l]) =>
      h('button', { 'aria-pressed': String(filt.range === v), onclick: () => { filt.range = v; renderReservations(root); } }, l)));
    const status = h('select', { 'aria-label': 'Status', onchange: (e) => { filt.status = e.target.value; refreshRows(); } }, ['', 'confirmed', 'seated', 'cancelled'].map((s) => h('option', { value: s, selected: filt.status === s }, s ? s[0].toUpperCase() + s.slice(1) : 'All statuses')));
    const meta = h('span', { class: 'meta' });
    const exportBtn = h('button', { class: 'btn', onclick: () => exportCsv(currentList()) }, 'Export CSV');
    const tbody = h('tbody');
    const currentList = () => list;
    function refreshRows() {
      list = all.filter((r) => (filt.range === 'all' || (filt.range === 'today' && r.date === t) || (filt.range === 'upcoming' && r.date >= t) || (filt.range === 'past' && r.date < t))
        && (!filt.status || r.status === filt.status) && (!filt.q.trim() || [r.name, r.email, r.phone, r.code, r.notes].some((x) => (x || '').toLowerCase().includes(filt.q.trim().toLowerCase()))));
      list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time) * (filt.range === 'past' ? -1 : 1));
      meta.textContent = `${list.length} booking${list.length === 1 ? '' : 's'} · ${covers(live(list))} guests`;
      tbody.replaceChildren(...(list.length ? list.map(row) : [h('tr', {}, h('td', { colspan: 8, class: 'empty', style: 'text-align:center;padding:40px' }, 'No bookings match these filters.'))]));
    }
    const row = (r) => h('tr', {},
      h('td', {}, h('strong', {}, fmtD(r.date)), h('small', {}, fmtT(r.time))),
      h('td', {}, r.guests),
      h('td', {}, h('strong', {}, r.name), r.source === 'admin' ? h('span', { class: 'tag' }, 'phone / walk-in') : null, r.notes ? h('small', {}, r.notes) : null),
      h('td', {}, r.email ? h('a', { href: 'mailto:' + r.email }, r.email) : '', r.phone ? h('small', {}, h('a', { href: 'tel:' + r.phone }, r.phone)) : null),
      h('td', {}, r.code), h('td', {}, h('span', { class: 'pill ' + r.status }, r.status)), h('td', {}, actions(r)));
    const table = h('div', { class: 'card tbl' }, h('table', {}, h('thead', {}, h('tr', {}, ['When', 'Guests', 'Guest', 'Contact', 'Code', 'Status', ''].map((x) => h('th', {}, x)))), tbody));
    root.replaceChildren(h('div', { class: 'toolbar' }, search, seg, status, meta, exportBtn), table);
    refreshRows();
  }
  function exportCsv(list) {
    const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const rows = [['Date', 'Time', 'Guests', 'Name', 'Email', 'Phone', 'Notes', 'Code', 'Status', 'Source'], ...list.map((r) => [r.date, r.time, r.guests, r.name, r.email, r.phone, r.notes, r.code, r.status, r.source || 'website'])];
    const a = h('a', { href: URL.createObjectURL(new Blob([rows.map((r) => r.map(esc).join(',')).join('\n')], { type: 'text/csv' })), download: `reservations-${todayStr()}.csv` });
    document.body.append(a); a.click(); a.remove(); toast('CSV downloaded');
  }

  // ---------- Menu manager ----------
  const CATS = ['Starters', 'Mains', 'Desserts', 'Drinks'];
  async function loadMenu() { menu = await fetch('/api/menu').then((r) => r.json()); menuDirty = false; renderMenu($('#v-menu')); }
  function renderMenu(root) {
    const dirty = (v) => { menuDirty = v; save.disabled = !v; note.textContent = v ? 'You have unsaved changes' : 'All changes saved'; };
    const note = h('span', {}, 'All changes saved');
    const save = h('button', { class: 'btn acc', disabled: true, onclick: async () => {
      try { save.disabled = true; menu = await call('/api/admin/menu', { method: 'PUT', body: JSON.stringify(menu) }); dirty(false); toast('Menu saved. The website is updated.'); renderMenu(root); }
      catch (e) { toast(e.message, true); save.disabled = false; }
    } }, 'Save menu');
    const nextId = () => Math.max(0, ...menu.map((m) => m.id)) + 1;
    root.replaceChildren(h('p', { class: 'muted', style: 'margin:-8px 0 20px;color:var(--mute)' }, 'Edit names, prices and descriptions. To show a photo, put it in the images folder as dish-<number>.jpg (the number is shown under each dish).'),
      ...CATS.map((cat) => {
        const items = menu.filter((m) => m.category === cat);
        return h('div', { class: 'cat' }, h('h2', {}, cat, h('button', { class: 'btn sm', onclick: () => { menu.push({ id: nextId(), category: cat, name: 'New dish', description: '', price: 0 }); menuDirty = true; renderMenu(root); } }, '+ Add dish')),
          h('div', { class: 'card' }, items.length ? items.map((m) => {
            const img = new Image(); img.alt = ''; img.onload = () => th.replaceChildren(img); img.src = `/images/dish-${m.id}.jpg`;
            const th = h('div', { class: 'thumb' }, 'no photo');
            return h('div', { class: 'dish' }, th,
              h('label', { class: 'f-n' }, h('input', { value: m.name, maxlength: 80, 'aria-label': 'Dish name', oninput: (e) => { m.name = e.target.value; dirty(true); } }), h('small', { style: 'font-weight:400' }, `dish-${m.id}.jpg`)),
              h('label', { class: 'f-d' }, h('input', { value: m.description, maxlength: 200, placeholder: 'Description', 'aria-label': 'Description', oninput: (e) => { m.description = e.target.value; dirty(true); } })),
              h('label', { class: 'f-p' }, h('input', { type: 'number', min: 0, step: 1, value: m.price, 'aria-label': 'Price', oninput: (e) => { m.price = Number(e.target.value); dirty(true); } })),
              h('label', { class: 'f-c' }, h('select', { 'aria-label': 'Category', onchange: (e) => { m.category = e.target.value; menuDirty = true; renderMenu(root); } }, CATS.map((c) => h('option', { value: c, selected: c === m.category }, c)))),
              h('button', { class: 'btn sm danger f-x', onclick: async () => { if (await ask('Remove this dish?', m.name, 'Remove')) { menu = menu.filter((x) => x !== m); menuDirty = true; renderMenu(root); } } }, 'Remove'));
          }) : h('div', { class: 'empty', style: 'padding:18px 16px' }, 'No dishes in this category.')));
      }),
      h('div', { class: 'savebar' }, note, save));
    if (menuDirty) { dirty(true); }
  }

  // ---------- New booking dialog ----------
  const dlg = $('#dlg-new'), fnew = $('#f-new');
  for (let i = 1; i <= 12; i++) fnew.guests.append(new Option(i === 1 ? '1 guest' : i + ' guests', i, false, i === 2));
  fnew.date.min = todayStr();
  async function slotsFor() {
    const date = fnew.date.value; if (!date) return;
    fnew.time.disabled = true; fnew.time.replaceChildren(new Option('Checking…', ''));
    try {
      const a = await fetch(`/api/availability?date=${date}&guests=${fnew.guests.value}`).then((r) => r.json());
      const open = (a.slots || []).filter((s) => s.available);
      fnew.time.replaceChildren(new Option(a.closed ? 'Closed this day' : open.length ? 'Choose a time' : 'Fully booked', ''), ...open.map((s) => new Option(`${fmtT(s.time)} (${s.seatsLeft} seats left)`, s.time)));
      fnew.time.disabled = !open.length;
    } catch { fnew.time.replaceChildren(new Option('Could not load times', '')); }
  }
  fnew.date.addEventListener('change', slotsFor); fnew.guests.addEventListener('change', slotsFor);
  $('#new-booking').addEventListener('click', () => { fnew.reset(); fnew.date.value = todayStr(); $('#new-err').textContent = ''; dlg.showModal(); slotsFor(); });
  fnew.addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = $('#new-save'), err = $('#new-err'); err.textContent = '';
    const d = Object.fromEntries(new FormData(fnew));
    if (d.name.trim().length < 2) { err.textContent = 'Enter the guest name.'; return; }
    if (!d.time) { err.textContent = 'Choose a time.'; return; }
    btn.disabled = true;
    try { const r = await call('/api/admin/reservations', { method: 'POST', body: JSON.stringify(d) }); dlg.close(); toast(`Booked ${r.name} · code ${r.code}`); await loadAll(); }
    catch (ex) { err.textContent = ex.message; } finally { btn.disabled = false; }
  });

  // ---------- Navigation / auth ----------
  const TITLES = { overview: ['Overview', () => fmtD(todayStr(), true)], reservations: ['Reservations', () => 'Search, filter and manage every booking'], menu: ['Menu', () => 'Changes appear on the website straight away'] };
  function render() {
    const [t, s] = TITLES[view]; $('#title').textContent = t; $('#subtitle').textContent = s();
    if (view === 'overview') renderOverview($('#v-overview')); else if (view === 'reservations') renderReservations($('#v-reservations'));
  }
  async function go(v) {
    if (menuDirty && view === 'menu' && v !== 'menu' && !await ask('Leave without saving?', 'Your menu changes have not been saved.', 'Leave')) return;
    if (v === view && v === 'menu') return;
    view = v; if (v !== 'menu') menuDirty = false;
    $$('.nav button').forEach((b) => b.setAttribute('aria-current', b.dataset.view === v ? 'page' : 'false'));
    ['overview', 'reservations', 'menu'].forEach((x) => { $('#v-' + x).hidden = x !== v; });
    const [ti, su] = TITLES[v]; $('#title').textContent = ti; $('#subtitle').textContent = su();
    if (v === 'menu') await loadMenu().catch((e) => toast(e.message, true)); else render();
    $('#new-booking').hidden = v === 'menu';
  }
  $$('.nav button').forEach((b) => b.addEventListener('click', () => go(b.dataset.view)));
  function signOut() { sessionStorage.removeItem('eo_admin'); token = ''; clearInterval(poll); $('#shell').hidden = true; $('#login-wrap').hidden = false; $('#tok').value = ''; }
  $('#out').addEventListener('click', signOut);
  async function start() { await loadAll(); clearInterval(poll); poll = setInterval(() => { if (view !== 'menu' && !document.hidden) loadAll(true).catch(() => {}); }, 30000); go('overview'); }
  $('#login').addEventListener('submit', async (e) => { e.preventDefault(); token = $('#tok').value; $('#lmsg').textContent = ''; try { await start(); sessionStorage.setItem('eo_admin', token); } catch (err) { $('#lmsg').textContent = err.message; } });
  if (token) start().catch(() => signOut());
})();
</script></body></html>
